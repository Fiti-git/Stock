services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
      - ./backups:/app/backups
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    networks:
      default:
        ipv4_address: 172.21.0.10
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://localhost:8000/api/auth/me/\",timeout=3).status in (200,401) else 1)'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        python manage.py migrate --noinput && \
        python manage.py collectstatic --noinput && \
        exec gunicorn config.wsgi:application \
          --bind 0.0.0.0:8000 \
          --workers ${GUNICORN_WORKERS:-4} \
          --threads ${GUNICORN_THREADS:-2} \
          --timeout 60 \
          --access-logfile - \
          --error-logfile -

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8002}:80"
    networks:
      default:
        ipv4_address: 172.21.0.11
    depends_on:
      backend:
        condition: service_healthy

  # ---------------------------------------------------------------------
  # Phase 0 additions — Redis + Celery worker + beat. Internal only.
  # The web service does NOT depend on these for serving requests; if Redis
  # is down, only background tasks (backfills, reservation expiry) pause.
  # ---------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - media_files:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency=2"]

  beat:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "config", "beat", "-l", "info"]

  # ---------------------------------------------------------------------
  # Phase 3 — public-facing storefront (Next.js). Talks to the backend
  # at the path served from the storefront's own host (so /api/... goes
  # through the storefront's reverse-proxied API path), OR if the user
  # configures STOREFRONT_API_BASE explicitly, that wins.
  #
  # In dev, set STOREFRONT_API_BASE to the externally-visible backend
  # URL (e.g. http://<vps-ip>:1606/api). For prod the recommendation is
  # Caddy + subdomains (Phase 6) — see deployment notes.
  # ---------------------------------------------------------------------
  storefront:
    build:
      context: ./storefront
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_BASE: ${STOREFRONT_API_BASE:-http://localhost:8001/api}
        NEXT_PUBLIC_DEFAULT_OUTLET_ID: ${STOREFRONT_DEFAULT_OUTLET_ID:-1}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE: ${STOREFRONT_API_BASE:-http://localhost:8001/api}
      API_INTERNAL_BASE: http://backend:8000/api
      NEXT_PUBLIC_DEFAULT_OUTLET_ID: ${STOREFRONT_DEFAULT_OUTLET_ID:-1}
    ports:
      - "${STOREFRONT_PORT:-5050}:3000"
    depends_on:
      - backend

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
          gateway: 172.21.0.1

volumes:
  postgres_data:
  media_files:
  static_files:
  redis_data:
